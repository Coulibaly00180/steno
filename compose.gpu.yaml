services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      # Affordable on a GPU, much better on names and jargon than "small".
      WHISPER_MODEL: large-v3-turbo
      # 32k tokens: a detailed summary of 3 hours no longer squeezes the block
      # summaries into ~2k tokens (qwen3:8b + KV cache fit in 16 GB of VRAM).
      LLM_NUM_CTX: "32768"
    deploy:
      # One worker: measured with 3 imports of 10 minutes on an RTX 5080, two
      # workers took 102 s and 95 s against 97 s and 83 s for one. Everything
      # heavy goes through the one card (Ollama answers one request at a time),
      # and a second worker lets the background jobs take the LLM from the
      # analyses. WORKER_REPLICAS=2 stays safe (app/gpu_slot.py, app/recovery.py)
      # for a machine with a second card, or many link downloads and clips.
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # The live model stays small ("small", ~0.5 GB) next to the worker's Whisper and Ollama.
  live:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    command: python -m app.live
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    environment:
      # The chat sends up to 30 000 characters of transcript.
      LLM_NUM_CTX: "32768"
      # Same default as the worker: the models page shows the model really used.
      WHISPER_MODEL: large-v3-turbo
      WORKER_REPLICAS: ${WORKER_REPLICAS:-1}
