[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    integration: requires PostgreSQL or other running local services
filterwarnings =
    # SQLite cannot reflect the expression indexes on glossary_terms and tags; PostgreSQL
    # tests compare it for real (tests/test_postgres_integration.py).
    ignore:Skipped unsupported reflection of expression-based index uq_glossary_terms_term_lower
    ignore:autogenerate skipping metadata-specified expression-based index 'uq_glossary_terms_term_lower'
    ignore:Skipped unsupported reflection of expression-based index uq_tags_name_lower
    ignore:autogenerate skipping metadata-specified expression-based index 'uq_tags_name_lower'
